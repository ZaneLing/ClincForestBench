[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "clincforestbench"
version = "0.1.0"
description = "A reproducible DDXPlus clinical decision arena and forest benchmark."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
  "alembic>=1.13,<2",
  "duckdb>=1.1,<2",
  "fastapi>=0.115,<1",
  "psycopg[binary]>=3.2,<4",
  "pyarrow>=17,<20",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "python-dotenv>=1,<2",
  "PyYAML>=6,<7",
  "sqlalchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1"
]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8"
]

[tool.setuptools.packages.find]
include = ["backend*", "etl*", "analysis*"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["backend", "etl"]
